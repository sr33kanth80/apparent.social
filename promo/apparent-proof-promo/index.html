<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf6;
      }

      body {
        color: #28262a;
        font-family: serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf6;
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf6;
      }

      #scene-1 {
        z-index: 1;
      }

      #scene-2 {
        z-index: 2;
        opacity: 0;
      }

      #scene-3 {
        z-index: 3;
        opacity: 0;
      }

      #scene-4 {
        z-index: 4;
        opacity: 0;
      }

      .scene-content {
        display: flex;
        width: 100%;
        height: 100%;
        padding: 96px 28px 140px;
        align-items: center;
        justify-content: center;
      }

      .art-frame {
        display: flex;
        position: relative;
        width: 1024px;
        height: 1566px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid rgba(40, 38, 42, 0.08);
        border-radius: 34px;
        background: #fffdfa;
        box-shadow:
          0 34px 76px rgba(40, 38, 42, 0.1),
          0 10px 28px rgba(151, 205, 229, 0.16);
      }

      .art-frame::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(200, 223, 170, 0.22);
        content: "";
        pointer-events: none;
      }

      .art-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .brand-bug {
        display: flex;
        position: absolute;
        right: 56px;
        bottom: 52px;
        z-index: 20;
        gap: 14px;
        align-items: center;
        padding: 14px 18px;
        border: 1.5px solid rgba(200, 223, 170, 0.9);
        border-radius: 999px;
        background: rgba(255, 253, 250, 0.9);
        box-shadow: 0 18px 34px rgba(40, 38, 42, 0.08);
      }

      .brand-bug__mark {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      .brand-bug__word {
        width: 158px;
        height: auto;
        object-fit: contain;
      }

      .outro {
        display: flex;
        position: absolute;
        left: 70px;
        right: 70px;
        bottom: 72px;
        z-index: 30;
        min-height: 190px;
        align-items: center;
        gap: 26px;
        padding: 28px 34px;
        border: 2px solid #c8dfaa;
        border-radius: 34px;
        background: rgba(255, 253, 250, 0.94);
        box-shadow: 0 22px 48px rgba(40, 38, 42, 0.13);
        opacity: 0;
      }

      .outro__mark {
        width: 92px;
        height: 92px;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .outro__copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        gap: 12px;
      }

      .outro__word {
        width: 270px;
        height: auto;
        object-fit: contain;
      }

      .outro__line {
        max-width: 640px;
        color: #4a4a4c;
        font-size: 38px;
        font-weight: 600;
        line-height: 1.08;
      }

      .accent-line {
        position: absolute;
        z-index: 0;
        height: 4px;
        border-radius: 999px;
        background: #c8dfaa;
        opacity: 0.8;
      }

      .accent-line--top {
        top: 54px;
        left: 156px;
        width: 300px;
        transform: rotate(-2deg);
      }

      .accent-line--bottom {
        right: 174px;
        bottom: 82px;
        width: 240px;
        transform: rotate(1.5deg);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15.2"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene-1" class="scene">
        <span class="accent-line accent-line--top"></span>
        <div class="scene-content">
          <figure class="art-frame" data-layout-allow-overflow>
            <img src="assets/proof-to-pipeline.png" alt="From proof to pipeline" />
          </figure>
        </div>
      </div>

      <div id="scene-2" class="scene">
        <span class="accent-line accent-line--bottom"></span>
        <div class="scene-content">
          <figure class="art-frame" data-layout-allow-overflow>
            <img src="assets/stop-losing-proof.png" alt="Stop losing proof" />
          </figure>
        </div>
      </div>

      <div id="scene-3" class="scene">
        <span class="accent-line accent-line--top"></span>
        <div class="scene-content">
          <figure class="art-frame" data-layout-allow-overflow>
            <img src="assets/less-list-more-fit.png" alt="Less list. More fit." />
          </figure>
        </div>
      </div>

      <div id="scene-4" class="scene">
        <span class="accent-line accent-line--bottom"></span>
        <div class="scene-content">
          <figure class="art-frame" data-layout-allow-overflow>
            <img src="assets/github-can-pitch.png" alt="Your GitHub can pitch" />
          </figure>
        </div>
        <div class="outro">
          <img class="outro__mark" src="assets/apparent-logo.png" alt="" />
          <div class="outro__copy">
            <img class="outro__word" src="assets/apparent-wordmark.png" alt="Apparent" />
            <p class="outro__line">Turn proof signals into investor fit.</p>
          </div>
        </div>
      </div>
      <div class="brand-bug">
        <img class="brand-bug__mark" src="assets/apparent-logo.png" alt="" />
        <img class="brand-bug__word" src="assets/apparent-wordmark.png" alt="Apparent" />
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const scenes = ["#scene-1", "#scene-2", "#scene-3", "#scene-4"];

      function enterScene(scene, at) {
        tl.from(
          `${scene} .art-frame`,
          { y: 42, opacity: 0, duration: 0.62, ease: "power3.out", overwrite: "auto" },
          at
        );
        tl.from(
          `${scene} .art-frame img`,
          { scale: 0.982, duration: 0.72, ease: "back.out(1.18)", overwrite: "auto" },
          at + 0.06
        );
        tl.from(
          `${scene} .accent-line`,
          { scaleX: 0, opacity: 0, duration: 0.54, ease: "expo.out", transformOrigin: "left center", overwrite: "auto" },
          at + 0.18
        );
      }

      function drift(scene, at, duration, x, y, scale) {
        tl.to(
          `${scene} .art-frame img`,
          { x, y, scale, duration, ease: "sine.inOut", overwrite: "auto" },
          at
        );
      }

      function blurCrossfade(fromScene, toScene, at) {
        tl.to(
          fromScene,
          { filter: "blur(9px)", scale: 1.025, opacity: 0, duration: 0.56, ease: "power2.inOut", overwrite: "auto" },
          at
        );
        tl.fromTo(
          toScene,
          { filter: "blur(12px)", scale: 0.982, opacity: 0 },
          { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.56, ease: "power2.inOut", overwrite: "auto" },
          at + 0.08
        );
      }

      enterScene(scenes[0], 0.18);
      tl.from(".brand-bug", { y: 24, scale: 0.96, opacity: 0, duration: 0.46, ease: "sine.out", overwrite: "auto" }, 0.44);
      drift(scenes[0], 0.9, 2.9, -10, -16, 1.025);

      blurCrossfade(scenes[0], scenes[1], 3.35);
      enterScene(scenes[1], 3.72);
      drift(scenes[1], 4.38, 2.65, 10, -14, 1.026);

      blurCrossfade(scenes[1], scenes[2], 6.9);
      enterScene(scenes[2], 7.27);
      drift(scenes[2], 7.92, 2.55, -9, -15, 1.027);

      blurCrossfade(scenes[2], scenes[3], 10.42);
      enterScene(scenes[3], 10.79);
      drift(scenes[3], 11.44, 2.8, 7, -18, 1.028);

      tl.fromTo(
        "#scene-4 .outro",
        { y: 34, scale: 0.98, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.58, ease: "power3.out", overwrite: "auto" },
        13.35
      );
      tl.to(".brand-bug", { y: 16, opacity: 0, duration: 0.34, ease: "sine.inOut", overwrite: "auto" }, 13.12);
      tl.to("#scene-4", { opacity: 0, duration: 0.68, ease: "sine.inOut", overwrite: "auto" }, 14.46);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
