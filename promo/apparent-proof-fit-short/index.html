<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf6;
      }

      body {
        color: #28262a;
        font-family: Georgia, serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fbfaf6;
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 10%, rgba(200, 223, 170, 0.42), rgba(200, 223, 170, 0) 300px),
          radial-gradient(circle at 82% 84%, rgba(151, 205, 229, 0.32), rgba(151, 205, 229, 0) 330px),
          #fbfaf6;
      }

      #scene-1 { z-index: 1; }
      #scene-2 { z-index: 2; opacity: 0; }
      #scene-3 { z-index: 3; opacity: 0; }
      #scene-4 { z-index: 4; opacity: 0; }
      #scene-5 { z-index: 5; opacity: 0; }
      #scene-6 { z-index: 6; opacity: 0; }

      .scene-content {
        display: flex;
        position: relative;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 72px 52px 92px;
      }

      .art-frame {
        display: flex;
        position: relative;
        width: 920px;
        height: 1390px;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid rgba(40, 38, 42, 0.11);
        border-radius: 34px;
        background: #fffdfa;
        box-shadow:
          0 30px 74px rgba(40, 38, 42, 0.14),
          0 8px 28px rgba(151, 205, 229, 0.2);
      }

      .art-frame--short {
        height: 1200px;
      }

      .art-frame--full {
        height: 1480px;
      }

      .art-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .asset-card {
        display: block;
        position: absolute;
        z-index: 20;
        filter: drop-shadow(8px 10px 0 rgba(40, 38, 42, 0.92));
      }

      .asset-hook {
        width: 900px;
      }

      .asset-signals {
        width: 760px;
      }

      .asset-badge {
        width: 680px;
      }

      .asset-payoff {
        width: 790px;
      }

      .asset-summary {
        width: 830px;
      }

      .asset-top { top: 116px; left: 90px; transform: rotate(-2.8deg); }
      .asset-mid { top: 675px; left: 160px; transform: rotate(2.5deg); }
      .asset-bottom { bottom: 130px; left: 126px; transform: rotate(-2.2deg); }
      .asset-right { right: 46px; bottom: 210px; transform: rotate(4deg); }

      .caption {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 66px;
        z-index: 30;
        min-height: 134px;
        padding: 26px 32px;
        border: 3px solid #28262a;
        border-radius: 32px;
        background: rgba(255, 253, 250, 0.96);
        box-shadow: 8px 8px 0 #28262a;
        color: #28262a;
        font-size: 48px;
        font-weight: 900;
        line-height: 0.98;
      }

      .caption span {
        color: #347f9f;
      }

      .big-type {
        max-width: 960px;
        color: #28262a;
        font-size: 128px;
        font-weight: 900;
        line-height: 0.9;
        text-align: center;
      }

      .big-type span {
        color: #567c2a;
      }

      .logo-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        text-align: center;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 38px 48px;
        border: 3px solid #c8dfaa;
        border-radius: 44px;
        background: rgba(255, 253, 250, 0.97);
        box-shadow: 10px 10px 0 #28262a;
      }

      .logo-mark {
        width: 122px;
        height: 122px;
        object-fit: contain;
      }

      .logo-word {
        width: 430px;
        height: auto;
        object-fit: contain;
      }

      .cta {
        max-width: 900px;
        color: #28262a;
        font-size: 82px;
        font-weight: 900;
        line-height: 0.96;
      }

      .tiny {
        color: #4a4a4c;
        font-size: 36px;
        font-weight: 850;
      }

      .slash {
        position: absolute;
        z-index: 0;
        width: 210px;
        height: 10px;
        border-radius: 999px;
        background: #c8dfaa;
      }

      .slash-a { top: 86px; left: 90px; transform: rotate(-8deg); }
      .slash-b { right: 112px; bottom: 108px; transform: rotate(7deg); background: #97cde5; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1080"
      data-height="1920"
    >
      <audio
        id="music"
        data-start="0"
        data-duration="16"
        data-track-index="9"
        src="assets/music.wav"
        data-volume="0.58"
      ></audio>
      <audio
        id="narration"
        data-start="0.45"
        data-duration="9.228"
        data-track-index="10"
        src="assets/narration.wav"
        data-volume="1"
      ></audio>

      <section id="scene-1" class="scene">
        <span class="slash slash-a"></span>
        <div class="scene-content">
          <img class="asset-card asset-hook" src="assets/short-kit/proof-not-pitch.svg" alt="Proof greater than pitch" />
          <div class="caption">Stop pitching <span>every investor.</span></div>
        </div>
      </section>

      <section id="scene-2" class="scene">
        <div class="scene-content">
          <figure class="art-frame art-frame--full" data-layout-allow-overflow>
            <img src="assets/stop-losing-proof.png" alt="Stop losing proof" />
          </figure>
          <img class="asset-card asset-signals asset-bottom" src="assets/short-kit/proof-signals.svg" alt="Proof signals" />
          <div class="caption">Your work becomes <span>proof.</span></div>
        </div>
      </section>

      <section id="scene-3" class="scene">
        <span class="slash slash-b"></span>
        <div class="scene-content">
          <figure class="art-frame art-frame--full" data-layout-allow-overflow>
            <img src="assets/github-can-pitch.png" alt="Your GitHub can pitch" />
          </figure>
          <img class="asset-card asset-badge asset-top" src="assets/short-kit/narration-card.svg" alt="Proof turns into investor fit" />
          <div class="caption">Launches. Commits. Traction. <span>Context.</span></div>
        </div>
      </section>

      <section id="scene-4" class="scene">
        <div class="scene-content">
          <figure class="art-frame art-frame--full" data-layout-allow-overflow>
            <img src="assets/less-list-more-fit.png" alt="Less list more fit" />
          </figure>
          <img class="asset-card asset-badge asset-bottom" src="assets/short-kit/thesis-fit-badge.svg" alt="Thesis fit badge" />
          <div class="caption">Matched to each investor's <span>thesis.</span></div>
        </div>
      </section>

      <section id="scene-5" class="scene">
        <div class="scene-content">
          <figure class="art-frame art-frame--short" data-layout-allow-overflow>
            <img src="assets/proof-to-pipeline.png" alt="Proof to pipeline" />
          </figure>
          <img class="asset-card asset-payoff asset-top" src="assets/short-kit/right-investor-now.svg" alt="Right investor right now" />
          <div class="caption">Right investor. <span>Right now.</span></div>
        </div>
      </section>

      <section id="scene-6" class="scene">
        <span class="slash slash-a"></span>
        <div class="scene-content">
          <div class="logo-lockup">
            <div class="logo-row">
              <img class="logo-mark" src="assets/apparent-logo.png" alt="" />
              <img class="logo-word" src="assets/apparent-wordmark.png" alt="Apparent" />
            </div>
            <img class="asset-summary" src="assets/short-kit/less-noise-more-signal.svg" alt="Less noise more signal" />
            <p class="cta">Proof signals into investor fit.</p>
            <p class="tiny">short-form fundraising signal</p>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const scenes = ["#scene-1", "#scene-2", "#scene-3", "#scene-4", "#scene-5", "#scene-6"];

      function enter(scene, at, hasArt, hasAsset, hasCaption, hasLogo, hasSlash) {
        if (hasArt) {
          tl.from(`${scene} .art-frame`, { y: 52, scale: 0.9, rotation: -1.2, opacity: 0, duration: 0.22, ease: "back.out(2.4)", overwrite: "auto" }, at);
          tl.to(`${scene} .art-frame img`, { y: -18, scale: 1.028, duration: 2.0, ease: "sine.inOut", overwrite: "auto" }, at + 0.18);
        }
        if (hasAsset) {
          tl.from(`${scene} .asset-card`, { y: 34, scale: 0.72, rotation: -6, opacity: 0, duration: 0.24, ease: "back.out(2.8)", overwrite: "auto" }, at + 0.12);
        }
        if (hasCaption) {
          tl.from(`${scene} .caption`, { y: 34, scale: 0.9, opacity: 0, duration: 0.2, ease: "power4.out", overwrite: "auto" }, at + 0.3);
        }
        if (hasLogo) {
          tl.from(`${scene} .logo-row`, { y: 52, scale: 0.84, rotation: -2, opacity: 0, duration: 0.3, ease: "back.out(2.4)", overwrite: "auto" }, at);
          tl.from(`${scene} .asset-summary`, { y: 34, scale: 0.86, opacity: 0, duration: 0.25, ease: "power4.out", overwrite: "auto" }, at + 0.42);
          tl.from(`${scene} .cta`, { y: 34, opacity: 0, duration: 0.22, ease: "power3.out", overwrite: "auto" }, at + 0.7);
          tl.from(`${scene} .tiny`, { y: 18, opacity: 0, duration: 0.2, ease: "sine.out", overwrite: "auto" }, at + 0.95);
        }
        if (hasSlash) {
          tl.from(`${scene} .slash`, { scaleX: 0, opacity: 0, duration: 0.18, transformOrigin: "left center", ease: "expo.out", overwrite: "auto" }, at + 0.08);
        }
      }

      function cut(fromScene, toScene, at) {
        tl.to(fromScene, { opacity: 0, scale: 1.045, filter: "blur(5px)", duration: 0.16, ease: "power4.in", overwrite: "auto" }, at);
        tl.fromTo(
          toScene,
          { opacity: 0, scale: 0.96, filter: "blur(8px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", overwrite: "auto" },
          at + 0.04
        );
      }

      enter(scenes[0], 0.12, false, true, true, false, true);
      tl.to("#scene-1 .asset-hook", { scale: 1.04, duration: 1.2, ease: "power1.inOut", overwrite: "auto" }, 0.65);

      cut(scenes[0], scenes[1], 2.35);
      enter(scenes[1], 2.62, true, true, true, false, false);

      cut(scenes[1], scenes[2], 5.05);
      enter(scenes[2], 5.32, true, true, true, false, true);

      cut(scenes[2], scenes[3], 7.72);
      enter(scenes[3], 7.98, true, true, true, false, false);

      cut(scenes[3], scenes[4], 10.35);
      enter(scenes[4], 10.62, true, true, true, false, false);

      cut(scenes[4], scenes[5], 13.08);
      enter(scenes[5], 13.35, false, false, false, true, true);
      tl.to("#scene-6 .logo-row", { scale: 1.035, duration: 0.42, ease: "power1.inOut", overwrite: "auto" }, 14.55);
      tl.to("#scene-6", { opacity: 0, duration: 0.28, ease: "power2.inOut", overwrite: "auto" }, 15.66);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
