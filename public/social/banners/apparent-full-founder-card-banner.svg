    <text x="0" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#42520d">to see.</text>
    <text x="2" y="258" font-family="Inter, Arial, sans-serif" font-size="22" fill="#111111" fill-opacity="0.62">A founder profile should be more than a bio.</text>
    <text x="2" y="289" font-family="Inter, Arial, sans-serif" font-size="22" fill="#111111" fill-opacity="0.62">It should carry proof, product, pitch, and momentum.</text>
