name: Start daily scrapes

on:
  workflow_dispatch:
  schedule:
    # 3:00 AM Central during daylight saving time. Adjust to 09:00 UTC for CST.
    - cron: "0 8 * * *"

jobs:
  start-daily-scrapes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call Supabase Edge Function
        env:
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secret: SUPABASE_CRON_SECRET" >&2
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "X-Cron-Secret: $CRON_SECRET" \
            "https://ykyskhezxfctqvzjbcfy.supabase.co/functions/v1/start_daily_scrapes"
