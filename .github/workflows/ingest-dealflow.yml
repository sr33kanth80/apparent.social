# Daily deal-flow ingestion — single Orthogonal-powered scout.
# POSTs /api/ingest-signals once per run. Needs one repo secret: AGENT_CRON_SECRET.
name: Ingest deal flow

on:
  schedule:
    - cron: '23 5 * * *' # daily 05:23 UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest
        run: |
          curl -sS -f -X POST \
            "https://apparent.social/api/ingest-signals" \
            -H "x-agent-cron-secret: ${{ secrets.AGENT_CRON_SECRET }}" \
            --max-time 570
