# Daily deal-flow ingestion — replaces the laptop-bound Claude Code routine.
# POSTs each source to /api/ingest-signals (see that file for source docs).
# Needs one repo secret: AGENT_CRON_SECRET (same value as the Vercel env var).
name: Ingest deal flow

on:
  schedule:
    - cron: '23 5 * * *' # daily 05:23 UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one flaky feed must not kill the others
      matrix:
        source: [hn, producthunt, github, yc, web]
    steps:
      - name: Ingest ${{ matrix.source }}
        run: |
          curl -sS -f -X POST \
            "https://apparent.social/api/ingest-signals?source=${{ matrix.source }}" \
            -H "x-agent-cron-secret: ${{ secrets.AGENT_CRON_SECRET }}" \
            --max-time 570
